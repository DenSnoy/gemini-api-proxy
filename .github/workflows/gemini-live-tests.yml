name: Gemini Live recorder tests

on:
  pull_request:
    paths:
      - "github-live/*.py"
      - ".github/workflows/gemini-live-*.yml"
  push:
    paths:
      - "github-live/*.py"
      - ".github/workflows/gemini-live-*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Gemini Live SDK
        run: python -m pip install --disable-pip-version-check google-genai
      - name: Syntax-check recorder
        run: python -m compileall -q github-live
      - name: Offline test PCM and WAV creation
        run: python -m unittest discover -s github-live -p "test_*.py" -v
