name: Gemini model routing — offline checks

on:
  push:
    paths:
      - "github-live/*.mjs"
      - ".github/workflows/gemini-model-tests.yml"
  pull_request:
    paths:
      - "github-live/*.mjs"
      - ".github/workflows/gemini-model-tests.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check Node syntax without installs
        run: |
          node --version
          node --check github-live/model-router.mjs
          node --check github-live/direct_gemini_text.mjs
          node --check github-live/direct_live_audio.mjs
          node --check github-live/test_model_router.mjs
          node --check github-live/direct_gemini_decision.mjs
          node --check github-live/test_direct_gemini_decision.mjs
          node --check github-live/refresh_model_catalog.mjs
      - name: Verify routing behavior offline, no inference
        run: |
          node github-live/test_model_router.mjs
          node github-live/test_direct_gemini_decision.mjs
