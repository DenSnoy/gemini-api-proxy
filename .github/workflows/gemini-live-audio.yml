name: Gemini Live — MP3 + WAV

on:
  push:
    branches: [main]
    paths:
      - "github-live/requests/*.json"
  workflow_dispatch:
    inputs:
      prompt:
        description: "Gemini Live voice acting or singing prompt"
        required: true
        type: string
        default: "Sing a cheerful original song for about 30 seconds, without an introduction."
      voice:
        description: "Gemini Live voice (Leda, Fenrir, Aoede, etc.)"
        required: true
        type: string
        default: Leda
      model:
        description: "Gemini Live model ID"
        required: true
        type: string
        default: gemini-3.8-live
      min_seconds:
        description: "Minimum generated duration"
        required: true
        type: string
        default: "25"

permissions:
  contents: read

jobs:
  generate:
    name: Generate finished Gemini Live MP3 and WAV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal WebSocket library
        run: python -m pip install --disable-pip-version-check "websockets>=14,<19" "imageio-ffmpeg>=0.5,<1"

      - name: Record complete Live audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT_INPUT: ${{ inputs.prompt || 'Sing a cheerful original song for about 30 seconds, without an introduction.' }}
          VOICE_INPUT: ${{ inputs.voice || 'Leda' }}
          MODEL_INPUT: ${{ inputs.model || 'gemini-3.8-live' }}
          MIN_SECONDS_INPUT: ${{ inputs.min_seconds || '25' }}
          TARGET_SECONDS_INPUT: "30"
        run: |
          REQUEST_ARGS=()
          if [[ "${{ github.event_name }}" == "push" ]]; then
            REQUEST_FILE="$(git show --pretty=format: --name-only HEAD | grep -E '^github-live/requests/[^/]+\.json$' | head -n 1 || true)"
            if [[ -z "$REQUEST_FILE" || ! -f "$REQUEST_FILE" ]]; then
              echo "No JSON audio request found" >&2
              exit 1
            fi
            REQUEST_ARGS=(--request-file "$REQUEST_FILE")
          fi

          python github-live/direct_live_audio.py \
            --prompt "$PROMPT_INPUT" \
            --voice "$VOICE_INPUT" \
            "${REQUEST_ARGS[@]}" \
            --model "$MODEL_INPUT" \
            --min-seconds "$MIN_SECONDS_INPUT" \
            --max-seconds 120 \
            --timeout-seconds 180 \
            --target-seconds "$TARGET_SECONDS_INPUT" \
            --attempts 2 \
            --output output/gemini-live.wav

      - name: Encode MP3 after completed WAV
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -nostdin -hide_banner -loglevel error -y \
            -i output/gemini-live.wav -codec:a libmp3lame -b:a 192k \
            output/gemini-live.mp3
          test -s output/gemini-live.mp3

      - name: Upload completed audio (MP3 + WAV)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-live-complete-audio
          path: |
            output/gemini-live.mp3
            output/gemini-live.wav
          if-no-files-found: error
          retention-days: 7
